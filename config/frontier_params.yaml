# ==============================================================================
# Frontier Exploration ROS 2 Parameters for Custom Differential Drive Rover
# ==============================================================================
frontier_explorer:
  ros__parameters:

    # --------------- TOPICS & FRAMES --------------- #
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose

    global_frame: map
    robot_base_frame: base_footprint

    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: exploration_complete

    frontier_marker_scale: 0.12

    # --------------- QoS --------------- #
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1

    # --------------- EXECUTION BEHAVIOR --------------- #
    autostart: true
    control_service_enabled: true
    completion_event_enabled: true

    # Frequency for frontier re-clustering and evaluation (Hz)
    execution_frequency: 1.0

    # Minimum seconds between consecutive goal preemption attempts
    goal_preemption_enabled: true
    goal_preemption_min_interval_s: 3.0
    goal_skip_on_blocked_goal: true

    post_goal_settle_enabled: true
    post_goal_min_settle: 1.0

    frontier_suppression_enabled: true
    all_frontiers_suppressed_behavior: return_to_start

    # --------------- SCORING & DYNAMICS --------------- #
    weight_distance_wd: 1.2
    weight_gain_ws: 1.0

    # Rover Speed Bounds (scaled to match physical rover limits)
    max_linear_speed_vmax: 0.12
    max_angular_speed_wmax: 0.58
    sensor_effective_range_m: 2.0

    # --------------- NAVIGATION SAFETY & THRESHOLDS --------------- #
    # Minimum distance from robot to candidate frontier (2.5x radius 0.18m = 0.45m)
    frontier_selection_min_distance: 0.45
    frontier_candidate_min_goal_distance_m: 0.45
    frontier_visit_tolerance: 0.35

    occ_threshold: 65
    min_frontier_size_cells: 4

    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1

    # --------------- PREEMPTION & LIKELIHOOD --------------- #
    goal_preemption_complete_if_within_m: 0.35
    goal_preemption_lidar_range_m: 10.0
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 2.0
    goal_preemption_lidar_min_reveal_length_m: 0.4

    # --------------- SUPPRESSION --------------- #
    frontier_suppression_attempt_threshold: 2
    frontier_suppression_base_size_m: 0.8
    frontier_suppression_expansion_size_m: 0.4
    frontier_suppression_timeout_s: 60.0
    frontier_suppression_no_progress_timeout_s: 15.0
    frontier_suppression_progress_epsilon_m: 0.20
    frontier_suppression_startup_grace_period_s: 10.0
