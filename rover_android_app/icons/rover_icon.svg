<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#070a13"/>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Left and Right Wheels -->
  <rect x="100" y="196" width="45" height="120" rx="16" fill="#38bdf8"/>
  <rect x="367" y="196" width="45" height="120" rx="16" fill="#38bdf8"/>
  <rect x="145" y="246" width="222" height="20" rx="6" fill="#64748b"/>

  <!-- Rover Chassis Body -->
  <rect x="166" y="166" width="180" height="180" rx="40" fill="url(#bodyGrad)" stroke="#00e5ff" stroke-width="8"/>

  <!-- LiDAR Sensor Turret -->
  <circle cx="256" cy="256" r="42" fill="#070a13" stroke="#00e5ff" stroke-width="6"/>
  <circle cx="256" cy="256" r="18" fill="url(#cyanGrad)"/>

  <!-- Forward Direction Arrow -->
  <path d="M 256 120 L 290 170 L 256 156 L 222 170 Z" fill="#00e5ff"/>
  <circle cx="256" cy="190" r="6" fill="#00e5ff"/>
</svg>
